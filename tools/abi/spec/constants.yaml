# The constant families (plan section 5.8; implementation plan 1.5): which enumerations
# export, under which prefix, with their values. The values: lists are written by
# tools/abi/draft_spec.py --update-constants from the AST and never typed; a pin bump reruns
# it and reviews the diff. Every value is also a static_assert against the C++ enumerator in
# src/constants.gen.cpp, so this file cannot drift from upstream without failing the build.
# BWAPI_ERROR is BWAPI's own Errors:: codes (Game::getLastError); the ABI's channel is BWAPI_ERR.

