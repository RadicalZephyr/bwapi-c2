# The PODs that cross the boundary (plan section 4; docs/spec-format.md section 3). Phase 1
# holds the bulk type tables (section 5.8): one row struct per type class with the scalar
# accessors as fields, each field naming the accessor it mirrors in from:, and a table: block
# that declares the bwapi_<class>_table() function the emitter writes from these fields; and
# the flat requiredUnits row, whose table is hand-written in src/bulk.cpp. The events, bullets
# and snapshots of phase 2 join this file. A class with no scalar accessor beyond getName and
# isValid (Order, Error, BulletType, ...) has no table: its id is its whole row.

- name: unittype_row
  doc: "One row of the UnitType table: every scalar accessor of the class for one id, in one crossing. The container-valued and string accessors stay function-only."
  table:
    class: UnitType
    c: bwapi_unittype_table
    doc: "Fills one bwapi_unittype_row per UnitType id, 0 to Unknown inclusive, up to cap, and returns the total number of rows. The caller sets size on element zero to its row size and that is the stride; each row comes back with size set to the bytes filled. A cap of 0 with NULL queries the count. Every field equals the accessor of the same name for that id."
  fields:
    - {name: id, type: int32, doc: "the type id, which is also the row's index"}
    - {name: get_race, type: "type:Race", from: "UnitType::getRace"}
    - {name: required_tech, type: "type:TechType", from: "UnitType::requiredTech"}
    - {name: cloaking_tech, type: "type:TechType", from: "UnitType::cloakingTech"}
    - {name: armor_upgrade, type: "type:UpgradeType", from: "UnitType::armorUpgrade"}
    - {name: max_hit_points, type: int32, from: "UnitType::maxHitPoints"}
