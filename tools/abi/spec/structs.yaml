- name: required_unit
  doc: "One requirement of one unit type, for the flat requiredUnits table: the type, the type it requires, and how many of it."
  fields:
    - {name: type, type: "type:UnitType", doc: "the unit type that has the requirement"}
    - {name: required_type, type: "type:UnitType", doc: "the unit type it requires"}
    - {name: count, type: int32, doc: "how many of the required type"}

# Phase 2 (implementation plan 2.1): the event of section 5.6. Text is not a field: it comes
# back through bwapi_game_event_text() under the string convention, so the struct stays a
# fixed-size POD and no pointer into BWAPI's own std::string crosses the boundary.
- name: event
  doc: "One event of the current frame, as bwapi_game_get_events() fills it: the BWAPI_EVENT_* type, and whichever of a unit, a player, a position and a winner flag that type carries, with BWAPI_NONE or the pixel-scale None in the others. The text of a SendText, ReceiveText or SaveGame event is not in the struct; bwapi_game_event_text() returns it for the same index."
  fields:
    - {name: type, type: int32, doc: "the kind of event, a BWAPI_EVENT_* constant"}
    - {name: unit_id, type: int32, doc: "the unit of the nine Unit* events (Discover, Evade, Show, Hide, Create, Destroy, Morph, Renegade, Complete); BWAPI_NONE for every other type, SaveGame included"}
    - {name: player_id, type: int32, doc: "the player of PlayerLeft and ReceiveText; BWAPI_NONE for every other type"}
    - {name: x, type: int32, doc: "the pixel x of a NukeDetect target; BWAPI_POSITION_NONE_X for every other type"}
    - {name: y, type: int32, doc: "the pixel y of a NukeDetect target; BWAPI_POSITION_NONE_Y for every other type"}
    - {name: is_winner, type: bool32, doc: "1 when a MatchEnd event says the bot's player won; 0 for a lost match and for every other type"}
