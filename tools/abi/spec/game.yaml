# The Game surface (plan section 5; implementation plan 2.1 onwards). Phase 2 fills this file
# step by step: the events of section 5.6 first, hand-written in src/bulk.cpp over the vector
# bwapi_client_update() snapshots; the grids, snapshots, collections and generated getters
# follow in their own steps. The skips for BWAPI::Event live here because the events are Game
# surface at the boundary: a host reads them from the per-frame pump and never constructs one.

- cpp: "Game::getEvents"
  c: bwapi_game_event_count
  self: game
  returns: int32
  source: src/bulk.cpp
  doc: >-
    How many events the current frame carries: the size of the snapshot bwapi_client_update()
    took of Game::getEvents(), which is what bwapi_game_get_events() drains and
    bwapi_game_event_text() indexes. Valid until the next update; a MatchStart frame carries a
    UnitDiscover per initial unit beside the MatchStart itself, so it is often the largest.

# The whole frame in one crossing (section 5.6). Game::getEvents backs both this and the count,
# the way UnitType::requiredUnits backs an accessor and a table. There is no per-index accessor:
# a host that paid a crossing per event paid it on the frames carrying the most of them.
- cpp: "Game::getEvents"
  c: bwapi_game_get_events
  self: game
  returns: "struct_array:event"
  source: src/bulk.cpp
  doc: >-
    Fills out with this frame's events, up to cap rows of stride bytes each, and returns the
    total the frame carries. The rows are in the order BWAPI produced them, not sorted: arrival
    order is information, and section 4's ID sort exists to defeat Unitset's nondeterminism,
    which an event list does not have. Each row's size comes back as the bytes filled, so
    BWAPI_HAS_FIELD says which fields are valid. A cap of 0 with NULL queries the count. The
    text of a SendText, ReceiveText or SaveGame row is not in the struct; bwapi_game_event_text()
    returns it for the same index.

- cpp: "Event::getText"
  c: bwapi_game_event_text
  self: game
  params: [{name: index, type: int32}]
  returns: string_out
  source: src/bulk.cpp
  doc: >-
    The text of the event at index: what was typed for SendText, what was received for
    ReceiveText, the file name for SaveGame, and the empty string for every other type. Under
    the string convention the return is the length the text needs, so no text_len field is
    needed on bwapi_event. An index outside the frame's events latches BWAPI_ERR_INVALID_HANDLE
    and returns the empty string.

