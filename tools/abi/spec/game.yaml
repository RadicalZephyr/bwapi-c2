# The Game surface (plan section 5; implementation plan 2.1 onwards). Phase 2 fills this file
# step by step: the events of section 5.6 first, hand-written in src/bulk.cpp over the vector
# bwapi_client_update() snapshots; the grids, snapshots, collections and generated getters
# follow in their own steps. The skips for BWAPI::Event live here because the events are Game
# surface at the boundary: a host reads them from the per-frame pump and never constructs one.

- cpp: "Game::getEvents"
  c: bwapi_game_event_count
  self: game
  returns: int32
  source: src/bulk.cpp
  doc: >-
    How many events the current frame carries: the size of the snapshot bwapi_client_update()
    took of Game::getEvents(), which is what bwapi_game_get_event() and bwapi_game_event_text()
    index. Valid until the next update; a MatchStart frame carries a UnitDiscover per initial
    unit beside the MatchStart itself, so it is often the largest.

- cpp: "Event::getType"
  c: bwapi_game_get_event
  self: game
  params: [{name: index, type: int32}, {name: out, type: "struct_out:event"}]
  returns: bool32
  source: src/bulk.cpp
  doc: >-
    Fills out with the event at index, 0 to bwapi_game_event_count() minus one, and returns 1.
    The caller sets out->size to its own sizeof(bwapi_event); the fields the library knows are
    written, the rest of that size is zeroed, and out->size comes back as the bytes filled, so
    BWAPI_HAS_FIELD says which fields are valid. An index outside the frame's events latches
    BWAPI_ERR_INVALID_HANDLE and returns 0 with nothing written; a NULL out, or a size too small
    to hold size itself, latches BWAPI_ERR_BAD_BUFFER the same way.

- cpp: "Event::getText"
  c: bwapi_game_event_text
  self: game
  params: [{name: index, type: int32}]
  returns: string_out
  source: src/bulk.cpp
  doc: >-
    The text of the event at index: what was typed for SendText, what was received for
    ReceiveText, the file name for SaveGame, and the empty string for every other type. Under
    the string convention the return is the length the text needs, so no text_len field is
    needed on bwapi_event. An index outside the frame's events latches BWAPI_ERR_INVALID_HANDLE
    and returns the empty string.

# The rest of BWAPI::Event: four accessors that are fields of bwapi_event, six setters and
# eighteen constructors a host has no use for.
