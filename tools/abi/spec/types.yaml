# ---- WeaponType ----------------------------------------------------------------------

- cpp: "WeaponType::getName"
  c: bwapi_weapontype_get_name
  self: none
  params: [{name: weapon, type: "type:WeaponType"}]
  returns: string_out
  doc: "The name of the weapon, as BWAPI spells it: the enumerator with its underscores, so a unit type reads \"Terran_Marine\". An id out of range names Unknown."

- cpp: "WeaponType::isValid"
  c: bwapi_weapontype_is_valid
  self: none
  params: [{name: weapon, type: "type:WeaponType"}]
  returns: bool32
  # Type<>(id) clamps an out-of-range id to Unknown before isValid() could see it, so
  # the generated call would always say 1; the range check is the whole answer.
  body: "return weapon >= 0 && weapon <= BWAPI::WeaponType(-1).getID();"
  doc: "1 when the id is one BWAPI knows for WeaponType, from 0 to the class's Unknown inclusive; 0 otherwise."

