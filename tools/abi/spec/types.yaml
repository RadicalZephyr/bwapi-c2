  params: [{name: player_type, type: "type:PlayerType"}]
  returns: bool32
  doc: "Identifies whether or not the type is used in-game. A type such as PlayerTypes::Closed would not be a valid in-game type."

# ---- GameType ------------------------------------------------------------------------

- cpp: "GameType::getName"
  c: bwapi_gametype_get_name
  self: none
  params: [{name: game_type, type: "type:GameType"}]
  returns: string_out
  doc: "The name of the game type, as BWAPI spells it: the enumerator with its underscores, so a unit type reads \"Terran_Marine\". An id out of range names Unknown."

- cpp: "GameType::isValid"
  c: bwapi_gametype_is_valid
  self: none
  params: [{name: game_type, type: "type:GameType"}]
  returns: bool32
  # Type<>(id) clamps an out-of-range id to Unknown before isValid() could see it, so
  # the generated call would always say 1; the range check is the whole answer.
  body: "return game_type >= 0 && game_type <= BWAPI::GameType(-1).getID();"
  doc: "1 when the id is one BWAPI knows for GameType, from 0 to the class's Unknown inclusive; 0 otherwise."

