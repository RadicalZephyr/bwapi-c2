# The static type data (plan section 5.8; implementation plan 1.5): every accessor of the
# fifteen type classes, one export each, plus getName and isValid from the Type<> base. Pure
# functions of a type id: self: none, no connection, no thread check. The container-valued
# accessors (requiredUnits, whatBuilds, abilities, upgrades, buildsWhat, whatUses, ...) get
# bodies expanding to parallel arrays, an out-param, or an id array (section 5.8).
#
# Drafted by tools/abi/draft_spec.py from the AST with upstream's summaries; edited by hand.

# ---- UnitType ------------------------------------------------------------------------

- cpp: "UnitType::getName"
  c: bwapi_unittype_get_name
  self: none
  params: [{name: unit_type, type: "type:UnitType"}]
  returns: string_out
  doc: "The name of the unit type, as BWAPI spells it: the enumerator with its underscores, so a unit type reads \"Terran_Marine\". An id out of range names Unknown."

- cpp: "UnitType::isValid"
  c: bwapi_unittype_is_valid
  self: none
  params: [{name: unit_type, type: "type:UnitType"}]
  returns: bool32
  # Type<>(id) clamps an out-of-range id to Unknown before isValid() could see it, so
  # the generated call would always say 1; the range check is the whole answer.
  body: "return unit_type >= 0 && unit_type <= BWAPI::UnitType(-1).getID();"
  doc: "1 when the id is one BWAPI knows for UnitType, from 0 to the class's Unknown inclusive; 0 otherwise."

- cpp: "UnitType::getRace"
  c: bwapi_unittype_get_race
  self: none
  params: [{name: unit_type, type: "type:UnitType"}]
  returns: "type:Race"
  doc: "Retrieves the Race that the unit type belongs to."

- cpp: "UnitType::whatBuilds"
  c: bwapi_unittype_what_builds
  self: none
  params: [{name: unit_type, type: "type:UnitType"}, {name: count, type: int32_out}]
  returns: "type:UnitType"
  body: |
    auto builder = BWAPI::UnitType(unit_type).whatBuilds();
    if (count) *count = builder.second;
    return builder.first;
  doc: "Obtains the source unit type that is used to build or train the unit type, as well as the amount of them that are required. The number of them needed is written to count when it is not NULL; a type nothing builds returns BWAPI_UNIT_NONE and a count of 0."

- cpp: "UnitType::requiredUnits"
  c: bwapi_unittype_required_units
  self: none
  params: [{name: unit_type, type: "type:UnitType"}, {name: types, type: int32_array_out}, {name: counts, type: int32_array_out}, {name: cap, type: int32}]
  returns: int32
  body: |
    if (!check_buffer(types, cap) || !check_buffer(counts, cap)) return 0;
    int32_t total = 0;
    for (const auto& req : BWAPI::UnitType(unit_type).requiredUnits()) {
      if (total < cap) {
        types[total] = req.first.getID();
        counts[total] = req.second;
      }
      ++total;
    }
    return total;
  doc: "Retrieves the immediate technology tree requirements to make the unit type. Written as parallel arrays of required type and count, ascending by type id, up to cap; returns the total number of requirements. A cap of 0 with NULL arrays queries the count."

