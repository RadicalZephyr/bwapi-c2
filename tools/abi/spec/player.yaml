- cpp: "PlayerInterface::isResearchAvailable"
  c: bwapi_player_is_research_available
  self: player
  params: [{name: tech, type: "type:TechType"}]
  returns: bool32
  doc: >-
    1 when the player is allowed to research the technology under the map's settings.

- cpp: "PlayerInterface::isUnitAvailable"
  c: bwapi_player_is_unit_available
  self: player
  params: [{name: unit_type, type: "type:UnitType"}]
  returns: bool32
  doc: >-
    1 when the player is allowed to create units of the type under the map's settings.

- cpp: "PlayerInterface::hasUnitTypeRequirement"
  c: bwapi_player_has_unit_type_requirement
  self: player
  params: [{name: unit_type, type: "type:UnitType"}, {name: amount, type: int32}]
  returns: bool32
  doc: >-
    1 when the player has at least amount completed units of the type, counting the equivalents
    BWAPI counts: a Lair or Hive for a Hatchery, a Hive for a Lair, a sieged tank for an unsieged
    one, and both Templar and Archon forms. Pass 1 for the plain requirement.
