  self: player
  params: [{name: unit_type, type: "type:UnitType"}]
  returns: int32
  doc: >-
    The sight range of a unit of the type for this player, the player's sight upgrades included.

- cpp: "PlayerInterface::weaponDamageCooldown"
  c: bwapi_player_weapon_damage_cooldown
  self: player
  params: [{name: unit_type, type: "type:UnitType"}]
  returns: int32
  doc: >-
    The ground weapon cooldown of a unit of the type for this player, the player's attack speed
    upgrades included.

- cpp: "PlayerInterface::armor"
  c: bwapi_player_armor
  self: player
  params: [{name: unit_type, type: "type:UnitType"}]
  returns: int32
  doc: >-
    The armour a unit of the type has for this player, upgrades included.

- cpp: "PlayerInterface::damage"
  c: bwapi_player_damage
  self: player
  params: [{name: weapon, type: "type:WeaponType"}]
  returns: int32
  doc: >-
    The damage the weapon deals for this player, upgrades included.

- cpp: "PlayerInterface::getUnitScore"
  c: bwapi_player_get_unit_score
  self: player
  returns: int32
  doc: >-
    The player's unit score, as on the end-game score screen.

- cpp: "PlayerInterface::getKillScore"
  c: bwapi_player_get_kill_score
  self: player
  returns: int32
  doc: >-
    The player's kill score, as on the end-game score screen.

- cpp: "PlayerInterface::getBuildingScore"
  c: bwapi_player_get_building_score
  self: player
  returns: int32
  doc: >-
    The player's building score, as on the end-game score screen.

- cpp: "PlayerInterface::getRazingScore"
  c: bwapi_player_get_razing_score
  self: player
  returns: int32
  doc: >-
    The player's razing score, as on the end-game score screen.

- cpp: "PlayerInterface::getCustomScore"
  c: bwapi_player_get_custom_score
  self: player
  returns: int32
  doc: >-
    The player's custom score, which map triggers set.

- cpp: "PlayerInterface::isObserver"
  c: bwapi_player_is_observer
  self: player
  returns: bool32
