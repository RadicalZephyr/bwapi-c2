# The documentation site (plan section 16.3; implementation plan 0.12).
#
# Pull requests build and check the site without deploying. Pushes to main build, check and
# deploy to GitHub Pages from the Actions artifact; there is no gh-pages branch, so the published
# site is always the output of one commit of main. External links are checked weekly, off the
# merge path, so a dead upstream link cannot block a deploy.
#
# Zola is installed from a pinned, checksummed release tarball, not a marketplace action: the
# docs job is the one job that can publish something, and its toolchain is not delegated.
#
# One-time repository setting, the only step not in the tree: Settings → Pages → Source →
# "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["site/**", "api.json", "tools/abi/emit_docs.py", ".github/workflows/docs.yml"]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC: the external-link check

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'   # the weekly run is external-links alone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        # No submodules: the site needs neither a compiler nor the closure.
      - name: Install Zola (pinned, checksum verified)
        run: tools/install-zola.sh
      # The reference is generated at build time from api.json and never checked in (plan
      # section 16.1); copying api.json into static/ is also how /api.json is served. Needs only
      # the standard library: emit_docs.py reads JSON, not the spec.
      - name: Emit the reference pages and publish api.json
        run: |
          mkdir -p site/static
          cp api.json site/static/api.json
          python3 tools/abi/emit_docs.py
      - name: Check internal links and anchors
        run: zola check --skip-external-links
        working-directory: site
      - name: Build
        run: zola build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site/public

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Weekly, and only visibly failing: external links, with the level raised to error for this
  # run alone. Opens nothing, deploys nothing.
  external-links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola (pinned, checksum verified)
        run: tools/install-zola.sh
      - name: Check every link, external ones included
        run: |
          sed -i 's/^external_level = "warn"/external_level = "error"/' config.toml
          zola check
        working-directory: site
